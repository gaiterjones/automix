[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automix"
version = "0.1.0"
description = "Intelligent sequential audio mixer - judges how each track ends and the next begins, then renders a seamless mix with ffmpeg."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gaiterjones" }]
keywords = ["audio", "mixer", "dj", "bpm", "crossfade", "beat-detection", "ffmpeg"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Environment :: Console",
]
# No runtime dependencies: analysis is ffmpeg + the standard library.
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
automix = "automix.cli:main"

[project.urls]
Homepage = "https://github.com/gaiterjones/automix"
Issues = "https://github.com/gaiterjones/automix/issues"
Changelog = "https://github.com/gaiterjones/automix/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["automix"]
