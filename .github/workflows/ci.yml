name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # don't cancel 3.10 when 3.12 fails - a failure should read as two clear
      # results, not one failure and one "cancelled"
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Byte-compile
        run: python -m compileall -q automix

      - name: Unit tests (no ffmpeg needed)
        run: python -m unittest discover -s tests -v

      - name: End-to-end smoke test (synthetic tracks)
        run: bash tests/smoke.sh
